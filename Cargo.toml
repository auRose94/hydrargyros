[package]
name = "hyg"
version = "0.1.0"
edition = "2021"
description = "Hydrargyros — a Rust reimagining of gold (the Greek name for mercury, Hg): JS-like dynamic values (var) with copy-on-write ergonomics, plus the sugar that makes prototyping feel like JavaScript."
license = "MIT"

[workspace]
members = ["derive", "plugin-api"]
# the test plugin is deliberately OUT of the workspace: a plugin is an
# out-of-tree crate (the third-party shape), built on demand by the
# dynamic-ffi tests into their own target dir
exclude = ["tests/ffi-plugin"]

# Dependencies:
# - indexmap: gold's object preserves insertion order; indexmap is the wheel
#   for that — no hand-rolled ordered map.
# - serde: the non-negotiable. One Serialize/Deserialize impl on Var replaces
#   gold's hand-rolled JSON/BSON/CBOR/MsgPack/UBJSON — any serde format works
#   for free.
# - axum + tokio (optional, behind the `web` feature): the expressjs-like web
#   layer, where routes are `Var -> Var` closures. Needs the core to be
#   Send + Sync — which Arc/Mutex payloads deliver for the game module's
#   future job system too.
# No engine deps yet; Bevy coexistence is a later concern (see docs/roadmap.md).

[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"] }
# FromVar: the typed hot-path seam (re-exported as hyg::FromVar)
hyg-derive = { path = "derive", version = "0.1.0" }
# the FFI plugin contract: mandated-export signatures + manifest types,
# shared by the host (behind `dynamic-ffi`) and every plugin author
# (unconditionally)
hyg-plugin-api = { path = "plugin-api", version = "0.1.0", optional = true }
# store documents are JSON files; http responses are JSON
serde_json = "1"
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"], optional = true }
# http internals: chunked/ws streams, HTTPS transport (gold's lws sslCert/sslKey)
futures-util = { version = "0.3", optional = true }
# game module: rapier = the world sim (gold's world/physicsBackend, via the
# `physics` feature); wgpu = the render backend (`wgpu` feature). Both
# optional so the core stays lean — gold gates Bullet the same way.
rapier3d = { version = "0.36", optional = true }
wgpu = { version = "30", optional = true }
winit = { version = "0.30", optional = true }
# blocking on wgpu adapter/device futures for offscreen setup
pollster = { version = "0.4", optional = true }
# glTF model loading (the `gltf` feature): meshes load from .gltf/.glb files
gltf = { version = "1", optional = true }
# texture image decoding (the `image` feature): Texture::from_file for PNGs
image = { version = "0.25", optional = true }
# script: the interpreter seam (gold's `script` facade) — DevYatsu's v12
# JavaScript engine, git-only (not on crates.io), pinned to a rev
v12-api = { git = "https://github.com/DevYatsu/v12", rev = "b24abaef5473ff39aa0d1719e631fc407cfd4b8", optional = true }
# audio playback (the `audio` feature): rodio = the device playback wheel
rodio = { version = "0.23", optional = true }
# QR codes for the stream page's hand-off menu (dep-free, pure generation)
qrcodegen = { version = "1.8", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
# dynamic-ffi: layout-stable plugin boundary (RString/RVec/RBoxError) — the
# trusted-tier plugin seam; loading mechanics via libloading (abi_stable's
# RootModule path is single-load-per-process and leak-by-design — the pivot
# note lives in src/dynamic/ffi.rs)
abi_stable = { version = "0.11", optional = true }
libloading = { version = "0.8", optional = true }
# dynamic-ffi: side-by-side scratch copies of plugin libraries (each loaded
# version maps its own file, never the one the build system writes)
tempfile = { version = "3", optional = true }

# tray deps are target-split: Linux renders the glyph through GTK
# (libappindicator), Windows/macOS use tray-icon's native backends. The
# `tray` feature references both `dep:` names — cargo ignores the ones a
# target doesn't carry.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", features = ["libappindicator"], optional = true }
gtk = { version = "0.18", optional = true }
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", optional = true }

[features]
default = []
# web: the http layer (Server/Response/ws/https). Optional so the core +
# parsers + store stay lean for embedding (Bevy etc.).
web = ["dep:axum", "dep:tokio", "dep:futures-util", "dep:axum-server", "dep:rustls", "dep:tokio-rustls"]
# physics: the rapier world sim (a "none" backend ships without it)
physics = ["dep:rapier3d"]
# render: the wgpu offscreen renderer
wgpu = ["dep:wgpu", "dep:pollster"]
# window: the winit desktop windowing backend (gold's windowSystemSDL slot)
winit = ["dep:winit"]
# tray: a system tray icon with a Quit menu (for headless windows)
tray = ["dep:tray-icon", "dep:gtk"]
# stream: the webapp windowing backend (canvas page over the render buffer;
# the QR hand-off menu rides along)
stream = ["dep:axum", "dep:tokio", "dep:futures-util", "dep:qrcodegen"]
# audio: playback (a no-op recorder backend ships without rodio touching a device)
audio = ["dep:rodio"]
# gltf: load triangle meshes from .gltf/.glb model files
gltf = ["dep:gltf"]
# image: decode texture image files (PNG/JPEG/...) into textures
image = ["dep:image"]
# script: the v12 interpreter seam (gold's script facade; scripted components)
script = ["dep:v12-api"]
# dynamic-ffi: native FFI plugins (the trusted tier) — abi_stable boundary,
# manifest load, hot-swap with drain. The graph tier (M2+) sits on top.
dynamic-ffi = ["dep:abi_stable", "dep:libloading", "dep:tempfile", "dep:hyg-plugin-api"]

[dev-dependencies]
serde_json = "1"
# web-layer tests drive the Router without binding a port (tower oneshot),
# and speak real HTTP/WebSockets against a live server
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
# self-signed certs for the HTTPS tests
rcgen = "0.13"
# PNG screenshots for the wgpu render example
image = "0.25"
# the QR scannability contract: the logo'd /qr decodes back to its URL
# (tests/stream.rs) — a dev-dep, so the shipped feature set stays untouched
rqrr = "0.8"

[[example]]
name = "web_demo"
required-features = ["web"]

[[example]]
name = "web_site"
required-features = ["web"]

[[example]]
name = "game_world"
required-features = ["physics", "wgpu"]

[[example]]
name = "game_stream"
required-features = ["physics", "wgpu", "stream"]

[[example]]
name = "game_window"
required-features = ["physics", "wgpu", "winit"]

[[example]]
name = "game_gltf"
required-features = ["wgpu", "stream", "gltf"]

[[example]]
name = "game_sandbox"
required-features = ["physics", "wgpu", "stream", "script", "audio"]

[[example]]
name = "script_seam"
required-features = ["script"]

[[example]]
name = "game_lights"
required-features = ["wgpu"]

[[example]]
name = "game_audio"
required-features = ["audio"]

[[example]]
name = "game_tray"
required-features = ["tray"]

# the FFI boundary proof: builds the out-of-tree test plugin, loads it,
# hot-swaps it under live traffic (tests/ffi-plugin is the plugin crate)
[[test]]
name = "dynamic_ffi"
required-features = ["dynamic-ffi"]
