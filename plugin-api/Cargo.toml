[package]
name = "hyg-plugin-api"
version = "0.1.0"
edition = "2021"
description = "The hyg FFI-plugin contract: the root-module struct and manifest types every native plugin is built against (the trusted tier of hyg::dynamic)."
license = "MIT"

[dependencies]
# layout-stable types across the boundary (RString/RVec/RBoxError) — the
# decided seam (docs/dynamic-design.md: Rust-shaped signatures, not a raw
# C pointer protocol)
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
